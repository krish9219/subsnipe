name: Bug report
description: Something in the scanner or the interface is wrong.
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Do not paste a real statement. Describe the shape of the file (bank, column names) and what SubSnipe did.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: File type
      options:
        - CSV
        - PDF
        - Sample statement
        - Not a file
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 131, Firefox 133, Safari 18
